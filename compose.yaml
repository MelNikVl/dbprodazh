name: dbprodazh
services:
  dashboard:
    image: dbprodazh:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8050:8050"
    environment:
      HOST: 0.0.0.0
      PORT: "8050"
      CRM_SAMPLE_DIR: /data
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://127.0.0.1:8050}"
    volumes:
      - type: bind
        source: "${CRM_SAMPLE_DIR:-../data}"
        target: /data
        read_only: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
